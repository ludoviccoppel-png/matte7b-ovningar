<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Geometric Figures Game</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js for 3D Rendering -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Google Fonts: Fredoka for child-friendly design -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Fredoka', cursive, sans-serif;
            background: linear-gradient(135deg, #a855f7 0%, #3b82f6 50%, #06b6d4 100%);
            min-height: 100vh;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px); }
            40%, 80% { transform: translateX(10px); }
        }

        .animate-shake {
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes pulse-bounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .animate-pulse-bounce {
            animation: pulse-bounce 0.6s infinite ease-in-out;
        }

        /* Glassmorphism card styles */
        .glass-card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            border: 2px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.15), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }

        .btn-option {
            transition: all 0.2s ease-in-out;
            box-shadow: 0 4px 0px rgba(0, 0, 0, 0.15);
        }

        .btn-option:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 0px rgba(0, 0, 0, 0.15);
        }

        .btn-option:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0px rgba(0, 0, 0, 0.15);
        }

        #canvas-container {
            width: 100%;
            height: 280px;
            position: relative;
            cursor: grab;
        }

        #canvas-container:active {
            cursor: grabbing;
        }
    </style>
</head>
<body class="flex items-center justify-center p-3 sm:p-6 text-gray-800">

    <div id="app" class="w-full max-w-2xl glass-card rounded-3xl p-4 sm:p-8 flex flex-col gap-5 relative overflow-hidden">
        
        <!-- Top Navigation / Stats Bar -->
        <div class="flex justify-between items-center bg-white/80 p-3 sm:p-4 rounded-2xl shadow-inner border border-purple-100">
            <!-- Points -->
            <div class="flex items-center gap-2">
                <span class="text-2xl sm:text-3xl">⭐</span>
                <div>
                    <div class="text-xs text-gray-500 font-bold uppercase tracking-wider">Poäng</div>
                    <div id="score" class="text-xl sm:text-2xl font-black text-purple-600">0</div>
                </div>
            </div>

            <!-- Streak -->
            <div class="flex items-center gap-2">
                <span class="text-2xl sm:text-3xl">🔥</span>
                <div>
                    <div class="text-xs text-gray-500 font-bold uppercase tracking-wider">Streak</div>
                    <div id="streak" class="text-xl sm:text-2xl font-black text-amber-500">0</div>
                </div>
            </div>

            <!-- Question Progress -->
            <div class="flex items-center gap-2">
                <span class="text-2xl sm:text-3xl">🎯</span>
                <div>
                    <div class="text-xs text-gray-500 font-bold uppercase tracking-wider">Fråga</div>
                    <div id="progress" class="text-xl sm:text-2xl font-black text-blue-600">1 / 10</div>
                </div>
            </div>
        </div>

        <!-- Progress Bar -->
        <div class="w-full bg-gray-200 h-3 rounded-full overflow-hidden p-0.5">
            <div id="progress-bar" class="bg-gradient-to-r from-purple-500 to-pink-500 h-full rounded-full transition-all duration-300" style="width: 10%"></div>
        </div>

        <!-- Instruction Banner -->
        <div class="text-center">
            <h1 class="text-xl sm:text-2xl font-bold text-gray-800">Vilken geometrisk kropp är detta?</h1>
            <p class="text-xs sm:text-sm text-gray-500 mt-1">Dra med musen/fingret för att rotera figuren!</p>
        </div>

        <!-- 3D Canvas Viewport Container -->
        <div class="relative bg-gradient-to-b from-indigo-50/80 to-purple-50/80 rounded-2xl overflow-hidden border-2 border-indigo-100">
            <div id="canvas-container" class="w-full"></div>
            <!-- Interactive hint overlay -->
            <div class="absolute bottom-2 right-3 text-xs bg-white/70 px-2.5 py-1 rounded-full text-indigo-700 pointer-events-none font-semibold flex items-center gap-1 shadow-sm">
                <span>🔄</span> 3D Vy
            </div>
        </div>

        <!-- Options Buttons Grid -->
        <div id="options-grid" class="grid grid-cols-2 sm:grid-cols-3 gap-3">
            <!-- Buttons will be dynamically populated by JS -->
        </div>

        <!-- Feedback & Explanation Box (Initially Hidden or Dynamic) -->
        <div id="feedback-card" class="hidden p-4 rounded-2xl transition-all duration-300 border-2">
            <div id="feedback-title" class="text-lg font-bold flex items-center gap-2"></div>
            <div id="feedback-text" class="text-sm mt-1 text-gray-700 leading-relaxed"></div>
            <button id="next-btn" onclick="game.nextQuestion()" class="mt-3 w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow-lg transition duration-200 text-base">
                Nästa figur ➔
            </button>
        </div>

    </div>

    <!-- Final Score Modal -->
    <div id="final-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="glass-card max-w-md w-full rounded-3xl p-6 sm:p-8 text-center flex flex-col items-center gap-4 animate-bounce-in">
            <div class="text-6xl mb-2">🏆</div>
            <h2 class="text-3xl font-extrabold text-gray-800">Bra jobbat!</h2>
            <p class="text-gray-600">Du har slutfört omgången!</p>
            
            <div class="bg-purple-50 w-full p-4 rounded-2xl border border-purple-100 flex justify-around my-2">
                <div>
                    <div class="text-xs text-gray-500 uppercase font-bold">Slutpoäng</div>
                    <div id="final-score" class="text-3xl font-black text-purple-600">0</div>
                </div>
                <div class="border-r border-purple-200"></div>
                <div>
                    <div class="text-xs text-gray-500 uppercase font-bold">Bästa Streak</div>
                    <div id="final-streak" class="text-3xl font-black text-amber-500">0</div>
                </div>
            </div>

            <button onclick="game.restart()" class="w-full py-4 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white text-lg font-bold rounded-2xl shadow-lg transition duration-200 transform hover:scale-[1.02]">
                Spela Igen 🔄
            </button>
        </div>
    </div>

    <script>
        // --- Web Audio API Sound Synthesizer ---
        class SoundFX {
            constructor() {
                this.ctx = null;
            }

            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }

            playCorrect() {
                this.init();
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                
                // Play melodic chord (C5 - E5 - G5)
                [523.25, 659.25, 783.99].forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, now + idx * 0.08);
                    
                    gain.gain.setValueAtTime(0.2, now + idx * 0.08);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.3);
                    
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    
                    osc.start(now + idx * 0.08);
                    osc.stop(now + idx * 0.08 + 0.3);
                });
            }

            playIncorrect() {
                this.init();
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(180, now);
                osc.frequency.exponentialRampToValueAtTime(110, now + 0.25);
                
                gain.gain.setValueAtTime(0.25, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                
                osc.start(now);
                osc.stop(now + 0.25);
            }
        }

        const sound = new SoundFX();

        // --- Data Definitions for 3D Shapes ---
        const SHAPES_DATA = [
            {
                id: 'kub',
                name: 'Kub',
                description: 'En kub har 6 helt lika stora kvadratiska sidor, 12 lika långa kanter och 8 hörn.',
                createMesh: (color) => {
                    const geometry = new THREE.BoxGeometry(2.2, 2.2, 2.2);
                    return createCustomMesh(geometry, color);
                }
            },
            {
                id: 'ratblock',
                name: 'Rätblock',
                description: 'Ett rätblock har 6 rektangulära sidor där motstående sidor är lika stora, 12 kanter och 8 hörn.',
                createMesh: (color) => {
                    const geometry = new THREE.BoxGeometry(3.2, 1.6, 1.8);
                    return createCustomMesh(geometry, color);
                }
            },
            {
                id: 'cylinder',
                name: 'Cylinder',
                description: 'En cylinder har två parallella, lika stora cirkulära basytor och en böjd mantelyta.',
                createMesh: (color) => {
                    const geometry = new THREE.CylinderGeometry(1.3, 1.3, 2.6, 32);
                    return createCustomMesh(geometry, color);
                }
            },
            {
                id: 'pyramid',
                name: 'Pyramid',
                description: 'En pyramid har en kvadratisk basyta och fyra triangelformade sidor som möts i en spets (top).',
                createMesh: (color) => {
                    const geometry = new THREE.ConeGeometry(1.8, 2.6, 4);
                    return createCustomMesh(geometry, color);
                }
            },
            {
                id: 'prisma',
                name: 'Prisma',
                description: 'Ett tresidigt prisma har två identiska triangelformade basytor och tre rektangulära sidor.',
                createMesh: (color) => {
                    const geometry = new THREE.CylinderGeometry(1.5, 1.5, 2.6, 3);
                    return createCustomMesh(geometry, color);
                }
            }
        ];

        // Colors palette for visual variety
        const COLOR_PALETTE = [
            0xff5964, // Bright Red/Pink
            0x35a7ff, // Vibrant Blue
            0x38b000, // Emerald Green
            0xff9f1c, // Bright Orange
            0x9d4edd  // Deep Purple
        ];

        function createCustomMesh(geometry, colorHex) {
            // Group to hold mesh + edge outlines for high definition graphics
            const group = new THREE.Group();

            const material = new THREE.MeshPhongMaterial({
                color: colorHex,
                shininess: 70,
                flatShading: false,
                transparent: true,
                opacity: 0.95
            });

            const mesh = new THREE.Mesh(geometry, material);
            group.add(mesh);

            // Add sharp wireframe outlines for clarity
            const edges = new THREE.EdgesGeometry(geometry);
            const lineMaterial = new THREE.LineBasicMaterial({ color: 0xffffff, linewidth: 2 });
            const wireframe = new THREE.LineSegments(edges, lineMaterial);
            group.add(wireframe);

            return group;
        }

        // --- Game Manager Engine ---
        class GameEngine {
            constructor() {
                this.score = 0;
                this.streak = 0;
                this.currentQuestionIndex = 0;
                this.totalQuestions = 10;
                this.currentShape = null;
                this.isAnswered = false;
                this.questionsList = [];

                // Three.js instances
                this.scene = null;
                this.camera = null;
                this.renderer = null;
                this.currentMesh = null;

                // Mouse/Touch Drag controls
                this.isDragging = false;
                this.previousMousePosition = { x: 0, y: 0 };

                this.init3D();
                this.generateQuestions();
                this.loadQuestion();
            }

            init3D() {
                const container = document.getElementById('canvas-container');
                const width = container.clientWidth;
                const height = container.clientHeight;

                // Scene
                this.scene = new THREE.Scene();

                // Camera
                this.camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
                this.camera.position.set(0, 0, 7);

                // Renderer
                this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                this.renderer.setSize(width, height);
                this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                container.appendChild(this.renderer.domElement);

                // Lighting
                const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
                this.scene.add(ambientLight);

                const dirLight1 = new THREE.DirectionalLight(0xffffff, 0.8);
                dirLight1.position.set(5, 10, 7);
                this.scene.add(dirLight1);

                const dirLight2 = new THREE.DirectionalLight(0x90e0ef, 0.4);
                dirLight2.position.set(-5, -5, -5);
                this.scene.add(dirLight2);

                // Handle Resize
                window.addEventListener('resize', () => this.onWindowResize());

                // Setup Touch / Drag Interaction
                this.setupDragControls(container);

                // Start Render Loop
                this.animate();
            }

            setupDragControls(container) {
                const onStart = (x, y) => {
                    this.isDragging = true;
                    this.previousMousePosition = { x, y };
                };

                const onMove = (x, y) => {
                    if (!this.isDragging || !this.currentMesh) return;

                    const deltaX = x - this.previousMousePosition.x;
                    const deltaY = y - this.previousMousePosition.y;

                    this.currentMesh.rotation.y += deltaX * 0.01;
                    this.currentMesh.rotation.x += deltaY * 0.01;

                    this.previousMousePosition = { x, y };
                };

                const onEnd = () => {
                    this.isDragging = false;
                };

                // Mouse Events
                container.addEventListener('mousedown', (e) => onStart(e.clientX, e.clientY));
                window.addEventListener('mousemove', (e) => onMove(e.clientX, e.clientY));
                window.addEventListener('mouseup', onEnd);

                // Touch Events
                container.addEventListener('touchstart', (e) => {
                    if (e.touches.length === 1) {
                        onStart(e.touches[0].clientX, e.touches[0].clientY);
                    }
                });
                window.addEventListener('touchmove', (e) => {
                    if (e.touches.length === 1) {
                        onMove(e.touches[0].clientX, e.touches[0].clientY);
                    }
                });
                window.addEventListener('touchend', onEnd);
            }

            animate() {
                requestAnimationFrame(() => this.animate());

                // Slow auto-rotation when user is not dragging
                if (this.currentMesh && !this.isDragging) {
                    this.currentMesh.rotation.y += 0.008;
                    this.currentMesh.rotation.x += 0.003;
                }

                this.renderer.render(this.scene, this.camera);
            }

            onWindowResize() {
                const container = document.getElementById('canvas-container');
                if (!container) return;
                const width = container.clientWidth;
                const height = container.clientHeight;

                this.camera.aspect = width / height;
                this.camera.updateProjectionMatrix();
                this.renderer.setSize(width, height);
            }

            generateQuestions() {
                this.questionsList = [];
                for (let i = 0; i < this.totalQuestions; i++) {
                    const randomShape = SHAPES_DATA[Math.floor(Math.random() * SHAPES_DATA.length)];
                    const randomColor = COLOR_PALETTE[Math.floor(Math.random() * COLOR_PALETTE.length)];
                    this.questionsList.push({
                        shape: randomShape,
                        color: randomColor
                    });
                }
            }

            loadQuestion() {
                this.isAnswered = false;
                const currentData = this.questionsList[this.currentQuestionIndex];
                this.currentShape = currentData.shape;

                // Update UI Header Stats
                document.getElementById('progress').innerText = `${this.currentQuestionIndex + 1} / ${this.totalQuestions}`;
                document.getElementById('progress-bar').style.width = `${((this.currentQuestionIndex + 1) / this.totalQuestions) * 100}%`;
                
                // Hide Feedback Box
                const feedbackCard = document.getElementById('feedback-card');
                feedbackCard.classList.add('hidden');

                // Render 3D Model
                if (this.currentMesh) {
                    this.scene.remove(this.currentMesh);
                }

                this.currentMesh = this.currentShape.createMesh(currentData.color);
                // Initial rotation angle for better perspective view
                this.currentMesh.rotation.x = 0.4;
                this.currentMesh.rotation.y = 0.5;
                this.scene.add(this.currentMesh);

                // Render Buttons
                this.renderOptionButtons();
            }

            renderOptionButtons() {
                const optionsGrid = document.getElementById('options-grid');
                optionsGrid.innerHTML = '';

                SHAPES_DATA.forEach(shape => {
                    const btn = document.createElement('button');
                    btn.className = 'btn-option py-3.5 px-4 bg-white hover:bg-indigo-50 border-2 border-indigo-200 text-indigo-900 font-bold rounded-2xl text-base sm:text-lg flex items-center justify-center text-center';
                    btn.innerText = shape.name;
                    btn.onclick = () => this.checkAnswer(shape.id, btn);
                    optionsGrid.appendChild(btn);
                });
            }

            checkAnswer(selectedId, buttonElement) {
                if (this.isAnswered) return;
                this.isAnswered = true;

                const feedbackCard = document.getElementById('feedback-card');
                const feedbackTitle = document.getElementById('feedback-title');
                const feedbackText = document.getElementById('feedback-text');
                const appCard = document.getElementById('app');

                // Disable all option buttons
                const allBtns = document.querySelectorAll('.btn-option');
                allBtns.forEach(btn => btn.classList.add('opacity-60', 'pointer-events-none'));

                if (selectedId === this.currentShape.id) {
                    // --- Correct Answer ---
                    sound.playCorrect();
                    this.score += 10 + (this.streak * 2); // Bonus score for streak
                    this.streak += 1;

                    // UI styling for correct button
                    buttonElement.classList.remove('opacity-60', 'bg-white', 'border-indigo-200');
                    buttonElement.classList.add('bg-emerald-500', 'text-white', 'border-emerald-600', 'scale-105');

                    // Confetti effect
                    confetti({
                        particleCount: 80,
                        spread: 70,
                        origin: { y: 0.6 }
                    });

                    // Feedback Content
                    feedbackCard.className = 'p-4 rounded-2xl transition-all duration-300 border-2 bg-emerald-50 border-emerald-300 text-emerald-900 block';
                    feedbackTitle.innerHTML = '<span>🎉</span> Rätt svar! Fantastiskt!';
                    feedbackText.innerText = this.currentShape.description;

                } else {
                    // --- Incorrect Answer ---
                    sound.playIncorrect();
                    this.streak = 0;

                    // UI Shake Animation
                    appCard.classList.add('animate-shake');
                    setTimeout(() => appCard.classList.remove('animate-shake'), 500);

                    // UI styling for wrong button
                    buttonElement.classList.remove('opacity-60', 'bg-white', 'border-indigo-200');
                    buttonElement.classList.add('bg-rose-500', 'text-white', 'border-rose-600');

                    // Highlight correct button
                    allBtns.forEach(btn => {
                        if (btn.innerText === this.currentShape.name) {
                            btn.classList.remove('opacity-60');
                            btn.classList.add('bg-emerald-100', 'border-emerald-400', 'text-emerald-800', 'font-extrabold');
                        }
                    });

                    // Feedback Content
                    feedbackCard.className = 'p-4 rounded-2xl transition-all duration-300 border-2 bg-rose-50 border-rose-300 text-rose-900 block';
                    feedbackTitle.innerHTML = `<span>💡</span> Inte riktigt! Det var en ${this.currentShape.name.toLowerCase()}.`;
                    feedbackText.innerText = this.currentShape.description;
                }

                // Update score display
                document.getElementById('score').innerText = this.score;
                document.getElementById('streak').innerText = this.streak;
            }

            nextQuestion() {
                this.currentQuestionIndex++;
                if (this.currentQuestionIndex < this.totalQuestions) {
                    this.loadQuestion();
                } else {
                    this.showFinalModal();
                }
            }

            showFinalModal() {
                document.getElementById('final-score').innerText = this.score;
                document.getElementById('final-streak').innerText = this.streak;
                document.getElementById('final-modal').classList.remove('hidden');

                // Big celebration confetti
                confetti({
                    particleCount: 150,
                    spread: 100,
                    origin: { y: 0.4 }
                });
            }

            restart() {
                this.score = 0;
                this.streak = 0;
                this.currentQuestionIndex = 0;
                document.getElementById('score').innerText = '0';
                document.getElementById('streak').innerText = '0';
                document.getElementById('final-modal').classList.add('hidden');
                this.generateQuestions();
                this.loadQuestion();
            }
        }

        // Global game instance reference
        let game = null;

        // Initialize App on Window Load
        window.onload = () => {
            game = new GameEngine();
        };
    </script>
</body>
</html>
